name: Check first-word retention through FastRTC and Fourier on CPU
on:
  push:
    branches: [ci/fourier-speech-boundaries]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: .github/fourier-boundaries
    env:
      GRADIO_ANALYTICS_ENABLED: 'False'
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      HF_HUB_DISABLE_XET: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare stock VAD, CPU recognizer and three speech fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends espeak-ng libsndfile1 >/dev/null
          python -m pip install -q uv
          uv pip install --system -q -r requirements.txt 'gradio==5.50.0' playwright
          espeak-ng -v en-us -s 150 -w question.wav 'What day is the meeting?'
          espeak-ng -v en-gb -s 145 -w answer.wav 'The meeting is on Friday.'
          curl -fsSL https://media.githubusercontent.com/media/andrewleech/qwen3-asr-onnx/4aee2ae0c355c7bc33bd5c09befec9e9eabd4b50/tests/fixtures/librispeech_0.wav -o human.wav
          echo '799f78ed4beb4de7ceae3a809262d4ce242394342ccd1d58cef7d49dbc2def46  human.wav' | sha256sum -c
      - name: Drive actual Gradio UI, compare both cuts of identical decoded WebRTC audio
        run: python boundaries.py
      - name: Save paired transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-turn-receipt
          path: .github/fourier-boundaries/result.json
          retention-days: 10
